# Habot Connect FZCO — Junior Cloud & DevOps Engineer Hiring Project
#
# File: .github/workflows/ci.yml
# Purpose: Fail-closed CI checks for Terraform correctness and
#          hardcoded secret detection.
#
# Author: Dipak Shimpi

name: Poka-Yoke CI

on:
  push:
  pull_request:

# The workflow only needs to read repository contents.
# Keeping permissions minimal follows the least-privilege principle.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      # ----------------------------------------------------------
      # Secret Detection
      # ----------------------------------------------------------

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}