---
# Habot Connect FZCO — Junior Cloud & DevOps Engineer Hiring Project
#
# File: .github/workflows/ci.yml
# Purpose: Fail-closed Poka-Yoke CI gate for the actual project:
#          Django/Python, HTML/CSS/JavaScript, YAML, Terraform,
#          and hardcoded-secret validation.
#
# Author: Dipak Shimpi
# Contact: shimpidipak81@gmail.com

name: Poka-Yoke CI

on:
  push:
  pull_request:

# The workflow only needs read access to repository contents.
# No write permissions are required for validation.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Python / Django Backend
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black

      - name: Run Flake8
        run: flake8 backend

      - name: Check Python formatting
        run: black --check backend

      # ----------------------------------------------------------
      # YAML Validation
      # ----------------------------------------------------------

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Validate GitHub Actions YAML
        run: yamllint .github/workflows/ci.yml

      # ----------------------------------------------------------
      # Terraform Infrastructure
      # ----------------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      # ----------------------------------------------------------
      # Frontend
      # ----------------------------------------------------------
      #
      # The project contains a lightweight HTML/CSS/JavaScript
      # frontend:
      #
      #   frontend/index.html
      #   frontend/script.js
      #   frontend/style.css
      #
      # It is not a React or Node.js package application.
      # Therefore npm, package.json, package-lock.json, and
      # ESLint dependencies are intentionally not introduced.
      #
      # ----------------------------------------------------------

      - name: Verify frontend source files
        shell: bash
        run: |
          test -f frontend/index.html
          test -f frontend/script.js
          test -f frontend/style.css

      # ----------------------------------------------------------
      # Secret Detection
      # ----------------------------------------------------------

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
