---
# Habot Connect FZCO — Junior Cloud & DevOps Engineer Hiring Project
#
# File: .github/workflows/ci.yml
# Purpose: Fail-closed CI checks for YAML correctness, Terraform
#          validation, hardcoded secrets, and IaC security.
#
# Author: Dipak Shimpi

name: Poka-Yoke CI

on:
  push:
  pull_request:

# The workflow only needs to read repository contents.
# This follows the least-privilege principle.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # YAML Validation
      # ----------------------------------------------------------

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Lint GitHub Actions YAML
        run: yamllint .github/workflows/ci.yml

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      # ----------------------------------------------------------
      # Secret Detection
      # ----------------------------------------------------------

      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Infrastructure Security Scan
      # ----------------------------------------------------------

      - name: Scan Terraform for security misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: 1
